[package]
name = "receipt_voice_capture"
version = "0.1.0"
edition = "2021"

[lib]
name = "receipt_voice_capture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# iOS/Android 起動クラッシュ回避のための vendor パッチ。
# tauri-runtime-wry の起動時 wry::webview_version() 呼び出しが、モバイルで
# NSBundle bundleWithIdentifier(@"com.apple.WebKit") の over-release により SIGTRAP する。
# vendor/tauri-runtime-wry/src/lib.rs:2817 付近を参照（crates.io の 2.10.1 に一致）。
[patch.crates-io]
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }
