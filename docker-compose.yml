# Receipt SaaS backend (multi-tenant) — local/self-hosted VM stack.
# See docs/saas-design.md for the architecture.
#
#   api      FastAPI backend (tenant core, auth, AI orchestration, journaling, export)
#   db       PostgreSQL 16 (Row Level Security enforced)
#   minio    S3-compatible object storage for images / audio / pdfs
#   caddy    HTTPS + single-origin: serves web/ SPA and proxies /api -> api
#
# Ollama / faster-whisper run on the VM HOST (not here); api reaches them via
# host.docker.internal (see extra_hosts).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-receipt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-receipt}
      POSTGRES_DB: ${POSTGRES_DB:-receipt}
    volumes:
      - db_data:/var/lib/postgresql/data
    # No host port published: the api reaches Postgres internally at db:5432.
    # Add a "ports: [127.0.0.1:5434:5432]" mapping locally if you need adminer/psql access.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-receipt}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build: ./api
    env_file:
      - ./api/.env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    # Reach host-resident Ollama / faster-whisper at host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  caddy:
    image: caddy:2
    depends_on:
      - api
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./web/dist:/srv
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  minio_data:
  caddy_data:
  caddy_config:
